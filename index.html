<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRANDA SPRINT - תיק עבודות</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- סרגל עליון -->
  <header class="top-bar">
    <img src="assets/sprint-logo.svg.svg" alt="Sprint Logo" class="brand-logo">
    <div class="tagline-strip">
      מיתוג • עיצוב מודעות • קטלוגים • דפי נחיתה ודיגיטל • האימפקט המהיר לעסק שלך ב-48 שעות
    </div>
  </header>

  <!-- אזור ה-Hero -->
  <section class="hero-container">
    <!-- הרקע הצהוב המעוגל -->
    <div class="hero-card">
      
      <!-- הקו המפותל ברקע -->
      <img src="assets/decorative-line.svg.svg" alt="" class="bg-line">

      <!-- צד ימין: טיפוגרפיה ומסגרת אלמנטים -->
      <div class="hero-text-area">
        <h2 class="sub-heading">קטלוג המוצרים של</h2>
        
        <div class="brand-frame-wrapper">
          <img src="assets/brand-dots.svg.svg" alt="ברנדה" class="brand-title-img">
          <img src="assets/brand-frame.svg.svg" alt="" class="bounding-box">
          <img src="assets/arrow-black.svg.svg" alt="" class="cursor-arrow">
        </div>
      </div>

      <!-- צד שמאל: הדמות המונפשת -->
      <div class="character-wrapper">
        <img src="assets/hero-character-body.png.png" alt="ברנדה" class="char-body">
        <img src="assets/hero-character-arm.png.png" alt="" class="char-arm">
        <img src="assets/hero-character-hand.png.png" alt="" class="char-hand">
        <img src="assets/hero-character-sparks.png.png" alt="" class="char-sparks">
      </div>

      <!-- חלק תחתון: לוגו וסטטיסטיקות -->
      <div class="hero-footer-strip">
        <div class="footer-brand">
          <img src="assets/branda-sprint-logo.svg.svg" alt="BRANDA SPRINT" class="footer-logo">
          <p>מעצבים לעסקים ביומיים</p>
        </div>

        <div class="stats-boxes">
          <div class="stat-box">
            <span class="stat-number">236+</span>
            <span class="stat-label">לקוחות שבחרו ספרינט</span>
          </div>
          <div class="stat-box">
            <span class="stat-number">9+</span>
            <span class="stat-label">שנות ניסיון ומיומנות</span>
          </div>
          <div class="stat-box highlight">
            <span class="stat-number">8.5M</span>
            <span class="stat-label">פיקסלים שדויקו לשלמות</span>
          </div>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
