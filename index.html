<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Branda Sprint - קטלוג מוצרים</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- סרגל עליון -->
  <header class="top-bar">
    <div class="brand-logo-wrapper">
      <img src="assets/sprint-logo.svg.svg" alt="Sprint Logo" class="brand-logo">
    </div>
    <div class="tagline-strip">
      מיתוג • עיצוב מודעות • קטלוגים • דפי נחיתה ודיגיטל • האימפקט המהיר לעסק שלך ב-48 שעות
    </div>
  </header>

  <!-- אזור Hero -->
  <section class="hero-container">
    
    <!-- ספירלת רקע -->
    <svg class="hero-bg-spiral" viewBox="0 0 1000 300" fill="none">
      <path d="M 0 150 Q 250 80, 500 150 T 800 120 C 830 80, 880 80, 890 120 C 900 160, 850 180, 830 140 C 820 100, 870 50, 1000 100" stroke="rgba(255, 255, 255, 0.45)" stroke-width="3" fill="none" />
    </svg>

    <!-- תוכן טקסטים בצד ימין -->
    <div class="hero-content">
      <div class="hero-title">
        <span class="title-small">קטלוג</span>
        <span class="title-large">המוצרים של</span>
      </div>

      <div class="brand-frame-wrapper">
        <span class="bg-number-48-hero">48</span>
        <!-- שימוש בשם קובץ ה-SVG המדויק לברנדה -->
        <img src="assets/brand-frame.svg.svg" alt="ברנדה" class="brand-svg-img" onerror="this.src='assets/brand-frame.svg'">
      </div>
    </div>

    <!-- בסיס לבן תחתון -->
    <div class="hero-bottom-deck">
      
      <!-- דמות ספרינט מוגדלת בצד שמאל עם יד מונפשת יחד -->
      <div class="hero-character-wrapper">
        <img src="assets/hero-character-body.png.png" alt="דמות ספרינט" class="hero-main-body" onerror="this.src='assets/hero-character-body.png'">
        <img src="assets/hero-character-hand.png.png" alt="יד" class="hero-animated-hand" onerror="this.src='assets/hero-character-hand.png'">
      </div>

      <!-- כיתוב המותג במרכז -->
      <div class="brand-sub-title">
        <span class="brand-name-en">BRANDA SPRINT</span>
        <span class="brand-tagline-he">מעצבים לעסקים ביומיים</span>
      </div>

      <!-- תיבת סטטיסטיקה בתכלת בצד שמאל -->
      <div class="hero-stats-box">
        <div class="stat-item">
          <span class="stat-num" data-target="236">0</span><span class="stat-plus">+</span>
          <span class="stat-text">לקוחות שבחרו ספרינט</span>
        </div>
        <div class="stat-item">
          <span class="stat-num" data-target="9">0</span><span class="stat-plus">+</span>
          <span class="stat-text">שנות ניסיון ומיומנות</span>
        </div>
        <div class="stat-item highlight">
          <span class="stat-num-static">8.5M</span>
          <span class="stat-text">פיקסלים שדויקו לשלמות</span>
        </div>
      </div>

    </div>

  </section>

  <!-- סקריפט להרצת המספרים -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const counters = document.querySelectorAll('.stat-num');
      counters.forEach(counter => {
        const target = +counter.getAttribute('data-target');
        let count = 0;
        const speed = target / 40;
        const updateCount = () => {
          count += speed;
          if (count < target) {
            counter.innerText = Math.ceil(count);
            setTimeout(updateCount, 30);
          } else {
            counter.innerText = target;
          }
        };
        updateCount();
      });
    });
  </script>

</body>
</html>
